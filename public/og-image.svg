<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" shape-rendering="crispEdges">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(106,191,90,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0b1510"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- left: large elf hero sprite scaled up -->
  <g transform="translate(80, 140) scale(12)">
    <rect x="9" y="0" width="2" height="1" fill="#c43a2a"/>
    <rect x="8" y="1" width="4" height="1" fill="#c43a2a"/>
    <rect x="7" y="2" width="6" height="1" fill="#c43a2a"/>
    <rect x="6" y="3" width="8" height="1" fill="#c43a2a"/>
    <rect x="5" y="4" width="10" height="1" fill="#c43a2a"/>
    <rect x="5" y="5" width="10" height="1" fill="#f4e8cf"/>
    <rect x="6" y="6" width="8" height="1" fill="#f3d1a6"/>
    <rect x="5" y="7" width="10" height="1" fill="#f3d1a6"/>
    <rect x="5" y="8" width="10" height="1" fill="#f3d1a6"/>
    <rect x="4" y="8" width="1" height="2" fill="#f3d1a6"/>
    <rect x="15" y="8" width="1" height="2" fill="#f3d1a6"/>
    <rect x="7" y="8" width="1" height="1" fill="#14261c"/>
    <rect x="12" y="8" width="1" height="1" fill="#14261c"/>
    <rect x="9" y="9" width="2" height="1" fill="#e0b389"/>
    <rect x="8" y="10" width="4" height="1" fill="#14261c"/>
    <rect x="8" y="11" width="4" height="1" fill="#f3d1a6"/>
    <rect x="5" y="12" width="10" height="1" fill="#2f5c44"/>
    <rect x="4" y="13" width="12" height="5" fill="#2f5c44"/>
    <rect x="4" y="15" width="12" height="1" fill="#6abf5a"/>
    <rect x="9" y="18" width="2" height="1" fill="#f2c94c"/>
    <rect x="6" y="19" width="3" height="5" fill="#8b5a3c"/>
    <rect x="11" y="19" width="3" height="5" fill="#8b5a3c"/>
    <rect x="5" y="24" width="4" height="2" fill="#14261c"/>
    <rect x="11" y="24" width="4" height="2" fill="#14261c"/>
    <rect x="7" y="10" width="1" height="1" fill="#6dc1d9"/>
  </g>
  <!-- right: text -->
  <g font-family="'Press Start 2P', monospace">
    <text x="500" y="210" font-size="64" fill="#f4e8cf">Elves</text>
    <text x="500" y="300" font-size="64" fill="#f4e8cf">Deserve</text>
    <text x="500" y="390" font-size="64" fill="#f2c94c">Better.</text>
  </g>
  <g font-family="'VT323', monospace">
    <text x="500" y="460" font-size="36" fill="rgba(244,232,207,0.8)">People for Ethical Treatment of Elves</text>
    <text x="500" y="500" font-size="28" fill="rgba(244,232,207,0.6)">A satirical parody. thisispete.org</text>
  </g>
  <!-- chip -->
  <rect x="500" y="120" width="220" height="36" fill="#6abf5a" stroke="#f4e8cf" stroke-width="3"/>
  <text x="516" y="146" font-family="'Press Start 2P', monospace" font-size="16" fill="#14261c">EST. 1823 • PARODY</text>
  <!-- bottom bar -->
  <rect x="0" y="610" width="1200" height="20" fill="#14261c"/>
  <rect x="0" y="615" width="1200" height="10" fill="#2f5c44"/>
</svg>
