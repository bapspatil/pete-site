<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- brand dark-forest background -->
  <rect width="16" height="16" fill="#14261c"/>
  <rect x="1" y="1" width="14" height="14" fill="#f2c94c"/>

  <!-- pointy red hat -->
  <rect x="7" y="2" width="2" height="1" fill="#c43a2a"/>
  <rect x="6" y="3" width="4" height="1" fill="#c43a2a"/>
  <rect x="5" y="4" width="6" height="1" fill="#c43a2a"/>
  <!-- cream hat brim -->
  <rect x="5" y="5" width="6" height="1" fill="#f4e8cf"/>

  <!-- face -->
  <rect x="5" y="6" width="6" height="2" fill="#f3d1a6"/>
  <!-- pointy ears -->
  <rect x="4" y="6" width="1" height="1" fill="#f3d1a6"/>
  <rect x="11" y="6" width="1" height="1" fill="#f3d1a6"/>
  <!-- eyes -->
  <rect x="6" y="7" width="1" height="1" fill="#14261c"/>
  <rect x="9" y="7" width="1" height="1" fill="#14261c"/>

  <!-- green tunic -->
  <rect x="4" y="8" width="8" height="3" fill="#2f5c44"/>
  <rect x="4" y="9" width="8" height="1" fill="#6abf5a"/>
  <!-- belt -->
  <rect x="4" y="11" width="8" height="1" fill="#14261c"/>
  <rect x="7" y="11" width="2" height="1" fill="#f2c94c"/>

  <!-- boots -->
  <rect x="5" y="12" width="2" height="2" fill="#14261c"/>
  <rect x="9" y="12" width="2" height="2" fill="#14261c"/>
</svg>
